services:
  - type: web
    name: ovoz-bot
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: python bot.py
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ovoz-bot-db
          property: connectionString

databases:
  - name: ovoz-bot-db
    databaseName: ovoz_db
    user: ovoz_user
